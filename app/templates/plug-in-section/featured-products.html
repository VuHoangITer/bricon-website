<!-- ==================== FEATURED PRODUCTS ==================== -->
<section class="py-5 bg-gray-dark">
  <div class="container">
    <!-- Section Title -->
    <div class="mb-5">
      <h2 class="fw-bold mb-3">Sản Phẩm Nổi Bật</h2>
      <div class="title-underline"></div>
    </div>

    <!-- Products Grid -->
    <div class="row g-4">
      {% for product in featured_products[:6] %}
        {% include 'components/card_product_home.html' with context %}
      {% endfor %}
    </div>
  </div>
</section>

<style>
/* ===== Thẻ sản phẩm trang chủ (.pcard) – chỉ áp dụng cho mục Sản Phẩm Nổi Bật ===== */
.pcard { height: 100%; display: flex; flex-direction: column; background: #fff; border-radius: 16px;
         overflow: hidden; border: 1px solid #eef0f3; box-shadow: 0 2px 10px rgba(17,24,39,.05);
         transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
.pcard:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(17,24,39,.12); border-color: #ffd54f; }

.pcard-media { position: relative; display: block; aspect-ratio: 1 / 1; padding: 22px;
               background: #fff; }  /* ảnh sản phẩm có nền trắng sẵn → khung trắng cho liền */
.pcard-media img { width: 100%; height: 100%; object-fit: contain; transition: transform .35s ease; }
.pcard:hover .pcard-media img { transform: scale(1.05); }
.pcard-sale { position: absolute; top: 12px; right: 12px; z-index: 1; background: #dc2626; color: #fff;
              font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }

.pcard-body { flex: 1; display: flex; flex-direction: column; padding: 16px 18px 18px; border-top: 1px solid #f1f2f4; }
.pcard-name { font-size: 1.02rem; font-weight: 700; line-height: 1.4; margin: 0 0 10px; min-height: 2.8em; text-align: center;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard-name a { color: #111827; text-decoration: none; }
.pcard-name a:hover { color: #b45309; }

.pcard-specs { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; justify-items: center; }
.pcard-specs li { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; color: #4b5563; min-width: 0; max-width: 100%; }
.pcard-specs li i { color: #f59e0b; font-size: 14px; flex: 0 0 auto; }
.pcard-specs li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pcard-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px;
              padding-top: 12px; border-top: 1px dashed #e5e7eb; }
.pcard-price strong { font-size: 1.05rem; color: #b91c1c; }
.pcard-price del { display: block; font-size: 12px; color: #9ca3af; }
.pcard-price-contact { font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; }
.pcard-price-contact i { color: #f59e0b; }
.pcard-btn { display: inline-flex; align-items: center; gap: 5px; padding: 0; background: none;
             color: #4b5563; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap;
             transition: color .2s ease; }
.pcard-btn i { font-size: 12px; transition: transform .2s ease; }
.pcard:hover .pcard-btn, .pcard-btn:hover { color: #b45309; }
.pcard:hover .pcard-btn i { transform: translateX(3px); }

/* Tablet nhỏ & điện thoại: 2 thẻ/hàng → gọn lại */
@media (max-width: 767.98px) {
  .pcard { border-radius: 12px; }
  .pcard-media { padding: 12px; }
  .pcard-body { padding: 10px 11px 12px; }
  .pcard-name { font-size: .9rem; margin-bottom: 6px; }
  .pcard-specs { margin-bottom: 8px; }
  .pcard-specs li { font-size: 11.5px; }
  .pcard-specs li:nth-child(2) { display: none; }
  /* Chân thẻ 1 hàng: "Giá liên hệ" bên trái, nút tròn mũi tên bên phải */
  .pcard-foot { flex-wrap: nowrap; gap: 6px; padding-top: 9px; }
  .pcard-price { flex: 1 1 auto; min-width: 0; }
  .pcard-price-contact { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .pcard-btn { flex: 0 0 auto; width: 28px; height: 28px; justify-content: center; border-radius: 50%;
               background: #fff4d1; color: #92400e; }
  .pcard-btn-text { display: none; }
  .pcard-btn i { font-size: 13px; }
  .pcard:hover .pcard-btn i { transform: none; }
}
/* Màn hình rất hẹp: bỏ icon điện thoại để chữ và nút tròn vừa 1 hàng */
@media (max-width: 400px) {
  .pcard-price-contact i { display: none; }
  .pcard-body { padding: 10px 9px 11px; }
}
</style>
